name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: javac -encoding UTF-8 --release 21 -d out src/ArtifactHashGuard.java tests/ArtifactHashGuardTest.java
      - run: java -cp out ArtifactHashGuardTest
      - run: jar --create --file artifact-hash-guard.jar --main-class ArtifactHashGuard -C out .
      - run: java -jar artifact-hash-guard.jar verify examples/checksums.sha256 examples/artifacts
